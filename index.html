<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বিশ্বাস কাউন্টার</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --main:#0D1117;
  --accent:#FF2E93;
  --bg:#05060A;
  --card:#0D1117;
  --muted:#9AA7B8;
  --line:#1F2A3A;
  --title:#00E5FF;--text:#EAF2FF;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",sans-serif;line-height:1.7}
h1,h2,nav b,.name,.t-time,.btn{font-family:"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.top{position:sticky;top:0;z-index:10;background:var(--main);color:#fff;padding:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.top .wrap{display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:8px}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.logo svg{width:26px;height:26px;fill:#FF2E93}
.brand-name{font-family:"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",sans-serif;font-weight:800;font-size:1.05rem;line-height:1.15}
.brand-sub{color:#e1efe9;font-size:.66rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btxt{flex:1;min-width:0}
.phones{flex:none;display:flex;align-items:center;gap:5px}
.phones svg{width:15px;height:15px;fill:#00E5FF}
.pnums{display:flex;flex-direction:column;line-height:1.5}
.pnums a{display:block;padding:1px 0;color:#fff;text-decoration:none;font-family:"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",sans-serif;font-size:.74rem;font-weight:600;white-space:nowrap;letter-spacing:0}
.clock{display:flex;align-items:center;justify-content:center;gap:8px;background:#05060A;border-radius:12px;padding:3px 10px;box-shadow:0 0 0 1.5px #00E5FF,0 0 14px rgba(0,229,255,.55)}
.clock svg{flex:none;width:18px;height:18px;fill:none;stroke:#00E5FF;stroke-width:2.2;stroke-linecap:round}
.ck-time{font-family:"Baloo Da 2","Hind Siliguri",sans-serif;font-weight:800;font-size:1.02rem;line-height:1.2;color:#00E5FF;text-shadow:0 0 10px rgba(0,229,255,.9),0 0 22px rgba(0,229,255,.5);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock>div{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:0 10px}
.ck-date{font-size:.72rem;color:#e1efe9;text-align:center}

nav .wrap{display:flex;gap:14px;align-items:center;justify-content:center;padding:8px 20px}
nav b{color:#fff;font-size:1.2rem;font-weight:800;white-space:nowrap}
nav span{white-space:nowrap}
nav a{color:#cfe3da;text-decoration:none;margin-left:14px;font-weight:500;white-space:nowrap}

.banner{background:#05060E;padding:0;position:relative;z-index:1}
.banner img{display:block;width:100%;max-width:1200px;height:auto;margin:0 auto}

.hero{position:relative;overflow:hidden;background:var(--main);color:#fff;padding:46px 0 58px}
.hero::before{content:"";position:absolute;right:-70px;top:50%;width:300px;height:300px;margin-top:-150px;border-radius:50%;background:var(--accent)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:radial-gradient(circle at 12px 12px,var(--bg) 9px,transparent 10px) repeat-x;background-size:24px 12px}
.hero .wrap{position:relative}
.hero h1{margin:0;font-size:3.2rem;line-height:1.1;font-weight:800}
.hero p{margin:10px 0 0;color:#e1efe9;font-size:1.15rem;max-width:20em}
.btns{margin-top:22px}
.btn{display:inline-block;padding:8px 22px;border-radius:999px;font-weight:700;font-size:1.05rem;text-decoration:none;background:var(--accent);color:#05060A}
.hero .btn{background:#fff;color:var(--main)}
.btn.alt2{background:transparent;color:var(--main);box-shadow:inset 0 0 0 2px var(--main)}

main section{padding:30px 0 6px}
h2{margin:0 0 16px;font-size:1.7rem;font-weight:800;line-height:1.2}

.slider{position:relative;overflow:hidden;border-radius:14px;background:var(--main);box-shadow:0 0 0 4px var(--main)}
.track{display:flex;transition:transform .5s ease}
.slide{position:relative;min-width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#cfe3da;font-weight:700;font-size:1.3rem}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:14px;bottom:14px;z-index:1;background:transparent;color:#fff;font-weight:800;font-size:.9rem;letter-spacing:.3px;padding:0;text-shadow:0 0 8px rgba(0,229,255,.9),0 2px 6px rgba(0,0,0,.85)}
.cap-tag{margin-left:4px;font-size:.58rem;font-weight:700;letter-spacing:.2px;color:#FFE600;text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.8)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:var(--main);font-size:1.4rem;line-height:1;cursor:pointer}
.prev{left:8px}.next{right:8px}
.dots{position:absolute;right:14px;bottom:18px;display:flex;gap:6px;z-index:2}
.dot{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.6);cursor:pointer}
.dot[aria-current="true"]{background:var(--accent);box-shadow:0 0 0 2px #fff}

.bus{margin-bottom:12px}
.bus-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:18px 20px;border:0;border-radius:12px;background:var(--card);box-shadow:0 0 0 1.5px var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.bus-head[aria-expanded="true"]{border-radius:12px 12px 0 0}
.name{font-family:"Hind Siliguri","Noto Sans Bengali",sans-serif;font-size:1.05rem;color:var(--muted)}
.b-title{font-family:"Baloo Da 2","Hind Siliguri",sans-serif;font-weight:800;font-size:1.25rem;line-height:1.35;color:var(--title);margin:0}
.t-label{font-size:.9rem;color:var(--muted)}
.t-time{font-family:"Hind Siliguri","Noto Sans Bengali",sans-serif;font-size:1.2rem}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:14px}
.det .l{font-size:.9rem;color:var(--muted)}
.det .v{font-size:1.15rem;overflow-wrap:anywhere}
.stops{color:var(--title);margin:0 0 14px}
.arr{color:var(--muted);font-size:1.3rem;transition:transform .2s}
.bus-head[aria-expanded="true"] .arr{transform:rotate(180deg)}
.li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.li:first-child{border-top:0}
.li-n{font-weight:700;font-size:1.1rem;color:var(--title)}
.li-d{color:var(--muted);text-align:right}
.li{width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.li-group+.li-group{border-top:1px dashed var(--line)}
.li-n::after{content:" \25BE";color:var(--muted);font-size:.8em}
.li[aria-expanded="true"] .li-n::after{content:" \25B4"}
.li:disabled .li-n::after{content:none}
.li-det{padding:0 0 14px}
.li-k{color:var(--muted)}
.li-coach{display:block;width:100%;padding:8px 0 6px 16px;margin:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.li-coach .li-k{font-weight:700;font-size:.95rem;color:var(--title)}
.li-coach .li-k::after{content:"\25BE";display:inline-block;margin-left:.35em;text-decoration:none;color:var(--muted);font-size:.8em}
.li-coach[aria-expanded="true"] .li-k::after{content:"\25B4"}
.li-coach .li-k.li-k-long{font-size:.8rem}
.li-v{padding:2px 0 0 16px;color:var(--text)}
.li-line{padding:3px 0;font-size:1rem;line-height:1.5}
.li-line b{font-weight:700;color:var(--text)}
.li-line i{font-style:italic;color:var(--muted)}
.li-callrow{display:block;white-space:nowrap;font-size:clamp(.78rem,3.9vw,1rem);color:var(--text);text-decoration:none;font-weight:600}
.li-ic{display:inline-block;vertical-align:-3px;margin:0 6px 0 2px}
.li-ic svg{width:16px;height:16px;fill:#00E5FF}
.li-route{display:flex;align-items:baseline;gap:6px}
.li-route b{flex:none}
.li-marq{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.li-marq-i{display:inline-block;padding-left:100%;animation:routemove 12s linear infinite}
.li-route:hover .li-marq-i{animation-play-state:paused}
@keyframes routemove{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.li-marq-i{animation:none;padding-left:0}}
.bus-head[aria-expanded="true"]+.more{margin-top:0;border-radius:0 0 12px 12px}
.more{margin-top:6px;padding:6px 20px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1.5px var(--line)}
.opt-title{font-weight:700;margin:8px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;box-shadow:inset 0 0 0 1.5px var(--main);background:transparent;color:var(--main);font:inherit;padding:5px 15px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);box-shadow:none;color:#fff;font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.empty{color:var(--muted)}

.box{background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:0 0 0 1.5px var(--line)}
.box p{margin:6px 0}
footer{margin-top:36px;background:var(--main);color:#cfe3da;text-align:center;padding:14px;font-size:.9rem}
.ticker{margin-top:26px;overflow:hidden;background:#CBD5E1;color:#05060A;border-radius:999px;padding:6px 0}
.ticker-track{display:flex;width:max-content;animation:tick 30s linear infinite}
.ticker:hover .ticker-track,.ticker:focus-within .ticker-track{animation-play-state:paused}
.ticker-track span{padding-right:3rem;white-space:nowrap;font-weight:600}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{transition:none}html{scroll-behavior:auto}.ticker-track{animation:none;width:auto}.ticker{overflow-x:auto}}
@media (max-width:480px){
  .hero h1{font-size:2.5rem}
  .hero::before{width:220px;height:220px;margin-top:-110px;right:-80px}
  nav .wrap{padding:8px 14px;gap:8px}

  nav b{font-size:1.05rem}
  nav a{margin-left:8px;font-size:.88rem}
}

@media (min-width:900px){
  .wrap{max-width:1100px}
  .top{padding:12px 0}
  .top .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:24px}
  .brand{flex:1;gap:14px}
  .logo{width:48px;height:48px;border-radius:14px}
  .logo svg{width:30px;height:30px}
  .brand-name{font-size:1.5rem}
  .brand-sub{font-size:.85rem}
  .phones{margin-left:12px;gap:8px}
  .phones svg{width:18px;height:18px}
  .pnums a{font-size:.9rem}
  .clock{flex:none;padding:6px 16px;gap:10px}
  .clock svg{width:22px;height:22px}
  .ck-time{font-size:1.3rem}
  .ck-date{font-size:.9rem}
  .hero{padding:70px 0 84px}
  .hero h1{font-size:4.2rem}
  .hero p{font-size:1.3rem;max-width:26em}
  .hero::before{width:420px;height:420px;margin-top:-210px;right:-100px}
  main section{padding-top:40px}
  h2{font-size:2rem}
  .slide{aspect-ratio:21/9}
  #busRows{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-items:start}
  .bus{margin-bottom:0}
  .b-title{font-size:1.4rem}
}

h2{text-shadow:0 0 14px rgba(0,229,255,.55)}
#tBus{font-size:1.4rem;text-decoration:underline;text-decoration-color:#39FF14;text-decoration-thickness:2px;text-underline-offset:7px}
@media (min-width:900px){#tBus{font-size:1.7rem}}
.b-title{text-shadow:0 0 10px rgba(0,229,255,.45)}
.brand-name{text-shadow:0 0 12px rgba(255,46,147,.7)}
.hero h1{text-shadow:0 0 18px rgba(255,46,147,.6)}
.hero::before{box-shadow:0 0 60px rgba(255,46,147,.55)}
.top{box-shadow:0 2px 18px rgba(0,229,255,.25);border-bottom:1px solid rgba(0,229,255,.35)}
.slider{box-shadow:0 0 0 3px #4A4F57,0 0 22px rgba(190,198,212,.45)}
.bus-head,.more,.box{box-shadow:0 0 0 1.5px #1F2A3A,0 0 12px rgba(0,229,255,.12)}
.bus-head:hover,.bus-head[aria-expanded="true"]{box-shadow:0 0 0 1.5px #00E5FF,0 0 16px rgba(0,229,255,.35)}
.btn{box-shadow:0 0 16px rgba(255,46,147,.6)}
.ticker{box-shadow:0 0 14px rgba(203,213,225,.4)}
footer{border-top:1px solid rgba(0,229,255,.35)}
footer .dev{margin-top:5px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:.78rem;font-weight:700;color:#39FF14;letter-spacing:.3px;text-shadow:0 0 10px rgba(57,255,20,.55)}
footer .dev img{width:20px;height:20px;border-radius:50%;object-fit:cover}
footer .dev .dev-by{color:#fff;font-weight:400;text-shadow:none}
.pay{margin:36px 12px 20px;background:#080B10;text-align:center;padding:18px 0 0;overflow:hidden;border:1.5px solid #B84DFF;border-radius:16px;box-shadow:0 0 16px rgba(184,77,255,.45),inset 0 0 14px rgba(184,77,255,.1)}
@media (min-width:900px){.pay{max-width:760px;margin-left:auto;margin-right:auto}}
footer{margin-top:0}
.pay-t{font-size:.85rem;letter-spacing:2px;color:var(--text);margin-bottom:12px;font-weight:600;text-decoration:underline;text-decoration-color:#FF2E93;text-decoration-thickness:2px;text-underline-offset:7px}
.pay-m{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.pay-track{display:flex;width:max-content;animation:paymove 30s linear infinite;padding:4px 0 16px}
.pay-m:hover .pay-track{animation-play-state:paused}
.pchip{flex:none;margin-right:12px;background:#fff;border-radius:10px;padding:10px 18px;font-weight:800;font-size:1.05rem;white-space:nowrap;box-shadow:0 0 12px rgba(0,229,255,.2)}
.pay-bar{height:5px;background:linear-gradient(90deg,#00E5FF,#FF2E93)}
.pay-text{text-align:left;color:#FFE600;font-size:1rem;font-weight:700;letter-spacing:1px;line-height:1.7;white-space:pre-line;text-shadow:0 0 10px rgba(255,230,0,.45)}
.pay-text:empty{display:none}
.pay-note{padding:0 14px 14px;font-size:.78rem;letter-spacing:.3px;color:var(--muted)}
.pay-note .star{color:#FF2E93;font-size:.95rem;margin-right:3px;text-shadow:0 0 6px rgba(255,46,147,.9),0 0 14px rgba(255,46,147,.6)}
.nbox{background:var(--card);border:1.5px solid #FF8A1F;border-radius:14px;padding:16px 16px 10px;box-shadow:0 0 14px rgba(255,138,31,.35),inset 0 0 12px rgba(255,138,31,.08)}
.nbox h3{margin:0 0 10px;font-size:1.15rem;color:#FFB066;text-shadow:0 0 10px rgba(255,138,31,.5)}
.nbox ul{list-style:none;margin:0;padding:0}
.nbox li{position:relative;padding:0 0 8px 22px;line-height:1.6;color:var(--text);font-size:.95rem}
.nbox li::before{content:"\2726";position:absolute;left:0;color:#FF8A1F}
.pay-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 12px 18px}
.pay-logos{display:flex;align-items:center;gap:6px}
.pay-logos img{display:block;height:22px;width:auto;background:#fff;border-radius:8px;padding:3px 5px;box-sizing:content-box}
@keyframes paymove{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.pay-track{animation:none;width:auto;flex-wrap:wrap;justify-content:center;row-gap:10px}.pchip.dup{display:none}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="5" width="21" height="11" rx="2.6" fill="#EAF6FF"/><rect x="4" y="7" width="3.2" height="3.4" rx=".7" fill="#0D1117"/><rect x="8.4" y="7" width="3.2" height="3.4" rx=".7" fill="#0D1117"/><rect x="12.8" y="7" width="3.2" height="3.4" rx=".7" fill="#0D1117"/><path d="M17.4 7h2.6c.6 0 1.1.4 1.3 1l.5 2.4h-4.4z" fill="#0D1117"/><rect x="1.5" y="12" width="21" height="1.3" fill="#00E5FF"/><circle cx="21.9" cy="14.6" r=".8" fill="#FFE600"/><circle cx="6.6" cy="17" r="2.5" fill="#EAF6FF"/><circle cx="6.6" cy="17" r="1" fill="#0D1117"/><circle cx="17.2" cy="17" r="2.5" fill="#EAF6FF"/><circle cx="17.2" cy="17" r="1" fill="#0D1117"/></svg></div>
    <div class="btxt"><div class="brand-name" id="navName"></div><div class="brand-sub" id="brandSub"></div></div>
    <div class="phones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg><div class="pnums"><a id="ph1"></a><a id="ph2"></a></div></div>
  </div>
  <div class="clock" role="timer" aria-label="বর্তমান সময় ও তারিখ">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <div><div class="ck-time" id="ckTime"></div><div class="ck-date" id="ckDate"></div></div>

var track = $("track"), dots = $("dots"), cur = 0, timer;
function go(i){
  cur = (i + BUSES.length) % BUSES.length;
  track.style.transform = "translateX(-" + (cur * 100) + "%)";
  Array.prototype.forEach.call(dots.children, function(d, k){ d.setAttribute("aria-current", k === cur); });
}
function restart(){ clearInterval(timer); timer = setInterval(function(){ go(cur + 1); }, 3500); }
BUSES.forEach(function(b, i){
  var s = document.createElement("div"); s.className = "slide";
  s.appendChild(document.createTextNode(b.name));
  var im = document.createElement("img"); im.alt = b.name;
  im.onload = function(){ if(im.naturalHeight && im.naturalWidth / im.naturalHeight < 1.2){ im.style.objectFit = "contain"; } };
  im.onerror = function(){ im.remove(); };
  im.src = b.img;
  s.appendChild(im);
  var cap = document.createElement("div"); cap.className = "cap"; cap.textContent = b.name;
  if(b.tag){ var tg = document.createElement("span"); tg.className = "cap-tag"; tg.textContent = b.tag; cap.appendChild(tg); }
  s.appendChild(cap);
  track.appendChild(s);
  var d = document.createElement("button"); d.className = "dot"; d.setAttribute("aria-label", b.name);
  d.onclick = function(){ go(i); restart(); };
  dots.appendChild(d);
});
$("prev").onclick = function(){ go(cur - 1); restart(); };
$("next").onclick = function(){ go(cur + 1); restart(); };

      var buildLines = function(lines){
        var box = el("div", "li-v"); box.hidden = true;
        (lines || []).forEach(function(ln){
          var row;
          if(ln[2]){

            row = el("a", "li-line li-callrow"); row.href = ln[2];

            var ic = el("span", "li-ic"); ic.innerHTML = PH; row.appendChild(ic);
            row.appendChild(document.createTextNode(ln[1]));
          } else if(ln[0] === "Route"){

            row = el("div", "li-line li-route");

            var mq = el("span", "li-marq"); mq.appendChild(el("i", "li-marq-i", ln[1])); row.appendChild(mq);
          } else {
            row = el("div", "li-line");
            row.appendChild(el("b", "", ln[0] + ": "));

          }
          box.appendChild(row);
        });
        if(!(lines || []).length){ box.appendChild(el("div", "li-line", "—")); }
        return box;
      };
      var myCoaches = [];
      var cl = (it.coaches && it.coaches.length) ? it.coaches : [null];
      cl.forEach(function(c){
        var obj = (c && typeof c === "object");

        var cv = buildLines(lines);
        var ci = {b: cb, p: cv}; COACHITEMS.push(ci); myCoaches.push(ci);
        cb.onclick = function(){
          var willOpen = cv.hidden;
          COACHITEMS.forEach(function(x){ setOpen(x.b, x.p, false); });
          if(willOpen){ setOpen(cb, cv, true); }
        };
        det.appendChild(cb); det.appendChild(cv);
      });
      var bi = {b: r, p: det, kids: myCoaches}; BUSITEMS.push(bi); myBuses.push(bi);
      r.onclick = function(){
        var willOpen = det.hidden;
        BUSITEMS.forEach(function(x){ setOpen(x.b, x.p, false); x.kids.forEach(function(k){ setOpen(k.b, k.p, false); }); });
        if(willOpen){ setOpen(r, det, true); }
      };
      grp.appendChild(det);
    } else { r.disabled = true; r.style.cursor = "default"; }
    more.appendChild(grp);
  });
  var ri = {b: head, p: more, kids: myBuses}; ROUTEITEMS.push(ri);

});
